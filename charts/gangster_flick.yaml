    - { name: B, shape: 4, multiplier: 3, note: "square x3 zig-zag: 12 bars, not repeated" }
    - { name: C, shape: 4, multiplier: 5, hashes: 1, note: "square x5 zig-zag: 20 bars, repeated once" }
