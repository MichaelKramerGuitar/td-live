title: Gangster Flick
composer: Michael Kramer
status: sketch          # notation only; no bar-by-bar changes yet
key: null
tempo: { bpm: null }

rhythm:                 # outer circle (orange in the drawing)
  meter: { beats: 5, unit: 4 }          # pentagon = 5/4
