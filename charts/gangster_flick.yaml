    - { quality: minor, root: null, note: "inside, ~8 o'clock" }
    - { quality: major, root: null, note: "outside, ~2 o'clock" }
    - { quality: major, root: null, note: "outside, ~3 o'clock" }
    - { quality: major, root: null, note: "outside, 6 o'clock" }

form:                   # inner circle (red)
  sections:
