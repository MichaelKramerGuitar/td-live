analysis:
  home: I
  notes:
    - "Gestural function (Michael): when the key elements are evoked, not every rule has to be followed for the
      ear to hear functional tension and release. Root movement and voice leading carry it. Derivation: Tadd
      Dameron's Lady Bird turnaround: I VI7 II7 V7 -> tritone-substitute all but I (C Eb7 Ab7 Db7) -> make them
      all major 7 (Cmaj7 Ebmaj7 Abmaj7 Dbmaj7): softened function, still pleasing voice leading, strong roots."
    - "Gbmaj7#11 -> Fmaj7 and Ebmaj7 -> D-7: a major 7 sitting where the (tritone-sub) dominant would be."
    - "D-7 C-7 Bb-7 A-7: the same spirit with minor 7s: going from D-7 to A-7 with a strong directional pull."
  A:
    - [I]
    - ["gestural subV/I (bIImaj7#11 for the dominant)"]
    - [I]
    - ["gestural subV/vi (bVIImaj7 -> vi)"]
    - [vi]
    - ["gestural subV/vi (bVIImaj7 -> vi)"]
    - ["gestural line (D-7 > A-7)", "gestural line"]
    - ["gestural line"]
    - ["iii (end of the line)"]
    - [IV]
    - [ii/vi, V/vi]
    - [vi]
    - [ii]
    - ["gestural subV/I"]
    - ["i (minor tonic)"]
    - ["gestural subV/I (turnaround)"]
