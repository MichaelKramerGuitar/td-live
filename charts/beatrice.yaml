# Beatrice - Sam Rivers (1964). Michael's changes, melodic nodes and hearing (2026-11-27), written in F and
# stored key-free. A mix of functional and "gestural" harmony: major-7 chords sitting where dominants would be
# (Gbmaj7#11 -> Fmaj7, Ebmaj7 -> D-7) and a minor-7 line falling with a strong directional pull (D-7 C-7 Bb-7 A-7).
# Form: 16 bars.
