    - "A1 travels away from home: Amaj13 (arrival), Ab13 (passing, V of what's to come), Gmaj13 (arrival),
      F#13 (imperfect cadence, V of B-something)."
    - "A2 recapitulates A1 a major third down: E and Ab are in the same Coltrane cohort (Ab C E). Murky."
    - "A2 bars 6-8: iii-vi-ii-V setting up C minor (C-6)."
    - "B: C-7 arrives, then pivots to iv of G minor. E-7b5 A7alt is ambiguous: we never arrive (in Whisper Not
      Golson does go to D-7, so maybe ii-V of D). F-7 pivots as ii of Eb; Bb7 = V, pivoting home as A1 -> A2."
