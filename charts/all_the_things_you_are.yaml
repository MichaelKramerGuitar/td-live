    - [[vi-7, 4]]                      # F-7
    - [[II7, 4]]                       # Bb7
    - [[Vmaj7, 4]]                     # Ebmaj7
    - [[Imaj7, 4]]                     # Abmaj7
    - [["#i-7", 2], ["#IV7", 2]]       # A-7 D7
    - [[VIImaj7, 4]]                   # Gmaj7
    - [[VIImaj7, 4]]                   # (Gmaj7)
  B:
