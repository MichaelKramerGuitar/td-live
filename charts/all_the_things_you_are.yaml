# All The Things You Are - Jerome Kern / Oscar Hammerstein II (1939). Michael's changes and hearing
# (2026-11-25), written in Ab and stored as Roman numerals. Spellings follow Michael's chart
# (D-7 G7, A-7 D7, F#-7 B7 Emaj7, Bdim7: letter arithmetic gives #iv-7, #i-7, #vi-7, #Vmaj7, #iio7 in Ab).
# Form: A1 8, A2 8, B 8, A3 12 = 36 bars. A2 = A1 up a fifth.
schema: tdlive-chart/0.2
id: all_the_things_you_are
title: All The Things You Are
composer: Jerome Kern
status: playable
changes_notation: roman
