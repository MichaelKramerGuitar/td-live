analysis:
  home: I
  notes:
    - "A1 goes to C (III), a member of Ab's Coltrane (major-third) cohort Ab C E."
    - "A2 is A1 transposed up a fifth: Eb is 'home away from home'; then to G (VII)."
    - "B: G (VII) as a temporary home. G -> F#-7 is a soft tritone substitution (the root moves by half step
      though the qualities are not a tritone sub). E (#V) is in G's minor-third cohort (G Bb Db E) AND in Ab's
      Coltrane cohort (Ab C E): related to the real home. C7alt = V/vi, going back home."
    - "A3: iv-6 (mode mixture), I6, then the diminished passing chord (Michael: 'biii diminished') to ii."
  A1:
    - [vi]
    - [ii]
    - [V]
    - [I]
    - [IV]
    - [ii/III, V/III]
    - [I/III]
    - [I/III]
  A2:
    - [vi/V]
    - [ii/V]
    - [V/V]
    - [I/V]
    - [IV/V]
    - [ii/VII, V/VII]
    - [I/VII]
    - [I/VII]
  B:
    - [ii/VII]
    - [V/VII]
    - [I/VII]
    - [I/VII]
    - ["ii/#V (soft tritone sub from G)"]
    - [V/#V]
    - [I/#V]
    - [V/vi]
  A3:
    - [vi]
    - [ii]
    - [V]
    - [I]
    - [IV]
    - [iv6]
    - [I6]
    - ["biiio7 (passing to ii)"]
    - [ii]
    - [V]
    - [I]
    - ["V/vi (turnaround)"]
