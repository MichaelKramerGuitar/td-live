# Michael Kramer's pitch–colour synesthesia, as data.
#
# The `description` fields are Michael's own words and are the source of truth.
# The `start` colours are only a representational starting point to tune BY EYE in TouchDesigner
# ("does this feel like D?"). Michael: "Every time I try to map out the exact hex values it's never right."
# Edit `start` freely; never edit `description` without Michael.
#
# NOTE: these colours are NOT the colours in the notation illustrations (charts/). Those are layer colours only.

schema: tdlive-palette/0.1
owner: Michael Kramer

principles:
  - Representational, not exact. The experience has a wispy, spatial, airy quality; render each colour as a
    soft field (drift, grain, depth), never as a flat swatch.
  - Colour belongs to the SPELLING, not the sound. Enharmonic pairs (C#/Db, D#/Eb, F#/Gb, G#/Ab, A#/Bb) are
    different colours, so audio alone can't choose one; the spelling comes from the chart's harmonic context.
  - In a chord the root dominates the sensation; the other chord tones and extensions only show up as
    accents, when attention goes to them.
  - The same colours appear when looking at a fretboard or a keyboard (a possible later visual).
  - The mapping has been stable as long as Michael can remember (likely formed while learning to read music;
    cf. Richard Cytowic, "Synesthesia").

colors:
  C:  { description: "Brown, like an Oak leaf in fall",                                   start: "#8C5A2E" }
  C#: { description: "Really Dark Brown, like Brunet hair",                               start: "#3A2418" }
  Db: { description: "Mint Creme green like the color of Wintergreen tic tacs",            start: "#C4EBD9" }
  D:  { description: "Green like an Oak leaf in spring, dark and deep green",             start: "#2F6A31" }
  D#: { description: "Take that Oak Leaf dark deep and make it darker and deeper",        start: "#173F1C" }
  Eb: { description: "Light Blue, Baby Blue",                                             start: "#A9D4F2" }
  E:  { description: "Darker Blue like an Yves Klein Blue but not quite as vibrant or resonant", start: "#2B3E96" }
  F:  { description: "Brownish-Purplish, like the skin of a beet that's just come out of the dirt", start: "#5B2C3C" }
  F#: { description: "Darker mud brown, Like Cleveland Browns Brown",                     start: "#3B2412" }
  Gb: { description: "Rose with an accent on the e like the wine",                        start: "#F2B8B1" }
  G:  { description: "Red like a Roma Tomato (more yellow in it that \"A\")",             start: "#D23B1F" }
  G#: { description: "Magenta but leaning red rather than purple",                        start: "#C4195A" }
  Ab: { description: "Very Similar to Rose like the wine but with more orangy/peachy warmth", start: "#F5B49A" }
  A:  { description: "Rose Red (substantially darker than \"G\")",                       start: "#9C1C33" }
  A#: { description: "Very Deep and Dark Crimson, the darkest of the Reds",               start: "#560B16" }
  Bb: { description: "Peach that's leaning Orange rather than Pink",                      start: "#F6A06A" }
  B:  { description: "Naval Orange",                                                       start: "#F37F27" }

# Starting values for how a chord becomes colour. Tune in TD; these are not part of Michael's experience data.
rendering:
  root_weight: 1.0          # the root fills the field
  tone_weight: 0.25         # other chord tones appear as quieter accents
  extension_weight: 0.15    # 9ths, 11ths, 13ths, altered tones

open_questions:
  - Spellings with no colour yet - Cb, Fb, E#, B#, double sharps/flats. Until Michael gives them a colour,
    the code falls back to the enharmonic spelling given in `fallback` and says so.
fallback: { Cb: B, Fb: E, "E#": F, "B#": C }
